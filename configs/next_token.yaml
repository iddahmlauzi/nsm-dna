# GPT-2-small-sized next-nucleotide model over 512-base GTDB sequences.

run:
  seed: 0
  resume_from: null

wandb:
  enabled: true
  entity: nsm-dna
  project: next-token
  name: next-token-512-gpt2-small-500m-5epochs
  run_id: null

data:
  subset_directory: ../datasets/gtdb/500M_subset
  train_split: train
  validation_split: validation
  sequence_length: 512
  # This is the per-GPU batch size.
  train_batch_size: 64
  validation_batch_size: 256
  num_workers: 3
  shuffle_buffer_size: 10_000

model:
  vocab_size: 4
  model_dim: 768
  num_layers: 12
  num_heads: 12
  dropout: 0.0
  bias: false
  use_qk_norm: true
  rope_base: 10_000

optimizer:
  learning_rate: 5e-4
  min_learning_rate: 1e-5
  # Five percent of the 19,075 optimizer steps in this five-epoch run.
  warmup_steps: 954
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 0.05
  max_gradient_norm: 1.0
  gradient_accumulation_steps: 1

mixed_precision:
  enabled: true

training:
  num_epochs: 5
  # Set an integer here for a shorter diagnostic run.
  max_steps: null
  log_interval: 10

evaluation:
  interval: 1_000
  max_batches: 10

checkpoint:
  # Overwrite the same recovery checkpoint throughout training.
  interval: 5_000

hydra:
  run:
    dir: ../runs/${wandb.name}
