# Transformer++ NSM-DNA over a 128-base prefix and 128-base target block.

run:
  seed: 0
  resume_from: null

# The checkpoint's stored model configuration is the source of truth for the
# tokenizer architecture, scale lengths, and codebook sizes.
tokenizer_checkpoint: ../runs/vqvae-128-block/checkpoints/final.pt

wandb:
  enabled: true
  entity: nsm-dna
  project: nsm
  name: nsm-256-40m

data:
  subset_directory: ../datasets/gtdb/5B_subset
  train_split: train
  validation_split: validation
  sequence_length: 256
  # Four GPUs at batch 64 with two accumulation steps match the NTP effective
  # batch of 512 sequences per optimizer update.
  train_batch_size: 64
  validation_batch_size: 128
  num_workers: 3
  shuffle_buffer_size: 10_000

model:
  # Match the 39.30M-parameter NTP Transformer backbone exactly. NSM-specific
  # scale refiners and the output head bring the stage-two total to 47.85M.
  model_dim: 640
  num_layers: 8
  num_heads: 10
  dropout: 0.0
  bias: false

  use_qk_norm: true
  rope_base: 10_000

  head_num_blocks: 2
  head_hidden_multiplier: 2.0
  input_refinement_kernel_size: 3

optimizer:
  learning_rate: 5e-4
  min_learning_rate: 1e-5
  # Five percent of the 38,147 optimizer steps in this one-epoch run.
  warmup_steps: 1_907
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 0.05
  max_gradient_norm: 1.0
  gradient_accumulation_steps: 2

  # A scale's loss share is proportional to length ** (1 - alpha).
  scale_loss_alpha: 0.25

mixed_precision:
  enabled: true

training:
  num_epochs: 1
  # Set an integer here to override the epoch-derived training length.
  max_steps: null
  log_interval: 10

evaluation:
  interval: 1_000
  max_batches: 10
  # Greedy scale rollout is substantially more expensive than teacher forcing.
  rollout_max_batches: 1

checkpoint:
  # Overwrite one recovery checkpoint frequently, while retaining a sparser
  # history for comparing or restarting from earlier training stages.
  recovery_interval: 5_000
  milestone_interval: 10_000
  huggingface:
    enabled: true
    repository_id: Iddah/nsm-dna-checkpoints
    repository_directory: nsm-256-40m

hydra:
  run:
    dir: ../runs/${wandb.name}
