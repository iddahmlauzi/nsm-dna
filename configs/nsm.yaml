# Predict absolute scales from 64 prefix latents, its scale-1 code, and earlier target codes.

run:
  seed: 0
  resume_from: null

# The checkpoint's stored model configuration is the source of truth for the
# tokenizer architecture, scale lengths, and codebook sizes.
tokenizer_checkpoint: ../runs/vqvae-256-continuous-final/checkpoints/best.pt

wandb:
  enabled: true
  entity: nsm-dna
  project: nsm
  name: nsm-256-prefix-scale1

data:
  subset_directory: ../datasets/gtdb/500M_subset
  train_split: train
  validation_split: validation
  sequence_length: 512
  # Four GPUs at batch 64 process 131,072 bases per optimizer update.
  train_batch_size: 64
  validation_batch_size: 8
  num_workers: 3
  shuffle_buffer_size: 10_000

model:
  # Match the width, depth, and head count of the GPT-2 small backbone.
  model_dim: 768
  num_layers: 12
  num_heads: 12
  dropout: 0.1
  bias: false

  use_qk_norm: true
  rope_base: 10_000

  head_num_blocks: 2
  head_hidden_multiplier: 2.0

optimizer:
  learning_rate: 5e-4
  min_learning_rate: 1e-5
  # Five percent of the 38,150 optimizer steps across ten epochs.
  warmup_steps: 1_907
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 0.05
  max_gradient_norm: 1.0
  gradient_accumulation_steps: 1

  # A scale's loss share is proportional to length ** (1 - alpha).
  scale_loss_alpha: 1

mixed_precision:
  enabled: true

training:
  num_epochs: 10
  # Set an integer here to override the epoch-derived training length.
  max_steps: null
  log_interval: 10

evaluation:
  interval: 1_000
  max_batches: 10
  # Greedy scale rollout is substantially more expensive than teacher forcing.
  rollout_max_batches: 1

checkpoint:
  # Overwrite the same recovery checkpoint throughout training.
  interval: 5_000

hydra:
  run:
    dir: ../runs/${wandb.name}
