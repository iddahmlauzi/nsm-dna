# Joint NSM-DNA training on complete 128-base sequences without prefix context.

run:
  seed: 0
  initialize_from: null
  resume_from: null
  reset_best_validation_loss: false

wandb:
  enabled: true
  entity: nsm-dna
  project: nsm-dna-end-to-end
  name: nsm-dna-end-to-end-contextual-no-prefix-supplied-scale4

data:
  subset_directory: ../datasets/gtdb/500M_subset
  train_split: train
  validation_split: validation
  # Match the tokenizer block length so the complete example is quantized. The
  # four codes at the first scale are supplied to predict the finer hierarchy.
  sequence_length: 128
  # Four GPUs with two accumulation steps produce an effective batch of 512
  # sequences per optimizer update.
  train_batch_size: 64
  validation_batch_size: 128
  num_workers: 1
  shuffle_buffer_size: 10_000

model:
  tokenizer:
    vocab_size: 4
    context_length: 128
    embed_dim: 384
    num_heads: 8
    scale_lengths: [4, 9, 16, 25, 36, 49, 64, 128]
    codebook_size: 256

    # One bidirectional Transformer block contextualizes the complete sequence
    # before quantization.
    encoder_num_layers: 1
    encoder_dropout: 0.0
    decoder_dropout: 0.1
    bias: false
    rope_base: 10_000
    pre_quant_num_groups: 4

    commitment_cost: 0.25
    decay: 0.99
    eps: 1e-5
    temperature: 1.0

    refinement_ratio: 0.5
    refinement_kernel_size: 3

  transformer:
    model_dim: 640
    num_layers: 8
    num_heads: 10
    dropout: 0.1
    bias: false
    use_qk_norm: true
    rope_base: 10_000
    head_num_blocks: 2
    head_hidden_multiplier: 2.0
    input_refinement_kernel_size: 3

optimizer:
  learning_rate: 1e-4
  min_learning_rate: 1e-5
  warmup_fraction: 0.05
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 0.05
  max_gradient_norm: 1.0
  gradient_accumulation_steps: 2

mixed_precision:
  enabled: true

training:
  # Freeze the complete tokenizer only for a continuation phase in which the
  # next-scale transformer learns against an unchanging latent hierarchy.
  freeze_tokenizer: false
  # Decode one uniformly sampled non-final true cumulative latent per batch.
  # A weak weight pressures early scales to retain nucleotide information.
  partial_reconstruction_loss_weight: 0.1
  # Decode the true first scale plus teacher-forced hard predictions for all
  # finer scales, with straight-through gradients into the transformer.
  teacher_forced_prediction_reconstruction_loss_weight: 1.0
  # This softens only the distribution used by the entropy loss. Hard code
  # selection, straight-through quantization, and EMA updates are unchanged.
  entropy_temperature: 16.0
  # Keep generation-first pressure constant for both epochs. There is no
  # reconstruction-refinement phase because reconstruction already converges
  # before the latent hierarchy stabilizes.
  next_scale_prediction_loss_weight: 8.0
  entropy_loss_weight: 2.0
  num_epochs: 2
  # Set an integer here for a shorter diagnostic run.
  max_steps: null
  # Keep the baseline next-scale inputs clean.
  input_code_corruption_probability: 0.0
  log_interval: 10

evaluation:
  interval: 1_000
  max_batches: 10
  # Re-encode these same validation examples at each evaluation to measure how
  # quickly the jointly trained tokenizer hierarchy is changing.
  stability_anchor_size: 32

checkpoint:
  recovery_interval: 1_000
  milestone_interval: 10_000

hydra:
  run:
    dir: ../runs/${wandb.name}
