# Transformer++ NSM-DNA over a 512-base prefix and 512-base target block.

run:
  seed: 0
  resume_from: null

# The checkpoint's stored model configuration is the source of truth for the
# tokenizer architecture, scale lengths, and codebook sizes.
tokenizer_checkpoint: ../runs/vqvae-512-8scale-500m-batch16/checkpoints/final.pt

wandb:
  enabled: true
  entity: nsm-dna
  project: nsm
  name: nsm-prefix512-target512-8scale-direct-prefix

data:
  subset_directory: ../datasets/gtdb/500M_subset
  train_split: train
  validation_split: validation
  sequence_length: 1_024
  # Four GPUs at batch 4 with eight accumulation steps process 131,072 bases
  # per optimizer update, matching the previous NSM configuration.
  train_batch_size: 4
  validation_batch_size: 8
  num_workers: 3
  shuffle_buffer_size: 10_000

model:
  # Match the 39.30M-parameter NTP Transformer backbone exactly. NSM-specific
  # scale refiners and the output head bring the stage-two total to 46.08M.
  model_dim: 640
  num_layers: 8
  num_heads: 10
  dropout: 0.1
  bias: false

  use_qk_norm: true
  rope_base: 10_000

  head_num_blocks: 2
  head_hidden_multiplier: 2.0
  input_refinement_kernel_size: 3

optimizer:
  learning_rate: 5e-4
  min_learning_rate: 1e-5
  # Five percent of the 38,150 optimizer steps across ten epochs.
  warmup_steps: 1_907
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 0.05
  max_gradient_norm: 1.0
  gradient_accumulation_steps: 8

  # A scale's loss share is proportional to length ** (1 - alpha).
  scale_loss_alpha: 1

mixed_precision:
  enabled: true

training:
  num_epochs: 10
  # Set an integer here to override the epoch-derived training length.
  max_steps: null
  # Replace this fraction of teacher-forced input codes during training.
  input_code_corruption_probability: 0.1
  log_interval: 10

evaluation:
  interval: 1_000
  max_batches: 10
  # Greedy scale rollout is substantially more expensive than teacher forcing.
  rollout_max_batches: 1

checkpoint:
  # Overwrite one recovery checkpoint frequently, while retaining a sparser
  # history for comparing or restarting from earlier training stages.
  recovery_interval: 5_000
  milestone_interval: 10_000

hydra:
  run:
    dir: ../runs/${wandb.name}
