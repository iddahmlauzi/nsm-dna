# Train the tokenizer and NSM-DNA jointly from nucleotide sequence.

run:
  seed: 0
  resume_from: null

wandb:
  enabled: true
  entity: nsm-dna
  project: end-to-end
  name: nsm-dna-end-to-end-triplet

data:
  subset_directory: ../datasets/gtdb/500M_subset
  train_split: train
  validation_split: validation
  # One 384-base prefix block followed by one 384-base target block.
  sequence_length: 768
  train_batch_size: 32
  validation_batch_size: 32
  num_workers: 3
  shuffle_buffer_size: 10_000

tokenizer:
  vocab_size: 4
  context_length: 384
  latent_length: 128
  embed_dim: 128
  quantization_dim: 16
  num_heads: 4
  rope_base: 10_000
  scale_lengths: [1, 2, 4, 8, 16, 32, 64, 128]
  codebook_sizes: [32, 32, 64, 64, 128, 128, 128, 21]
  decoder_num_layers: 4
  use_qk_norm: true
  bias: false

model:
  model_dim: 768
  num_layers: 12
  num_heads: 12
  dropout: 0.1
  bias: false
  use_qk_norm: true
  rope_base: 10_000
  head_num_blocks: 2
  head_hidden_multiplier: 2.0

objective:
  # Each step also reconstructs from one randomly sampled non-final scale.
  partial_reconstruction_weight: 0.25
  # Alpha 1 gives every hierarchy scale equal weight.
  scale_loss_alpha: 1

optimizer:
  learning_rate: 5e-4
  min_learning_rate: 1e-5
  warmup_steps: 1_907
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 0.05
  max_gradient_norm: 1.0
  gradient_accumulation_steps: 1

mixed_precision:
  enabled: true

training:
  num_epochs: 10
  max_steps: null
  log_interval: 10

evaluation:
  interval: 1_000
  max_batches: 10

checkpoint:
  interval: 5_000

hydra:
  run:
    dir: ../runs/${wandb.name}
