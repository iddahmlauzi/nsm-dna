# Multiscale VQ-VAE tokenizer with a discrete pairwise hierarchy.

run:
  seed: 0
  resume_from: null

wandb:
  enabled: true
  entity: nsm-dna
  project: vqvae
  name: vqvae-256-left-grouped-hierarchy-k64

data:
  subset_directory: ../datasets/gtdb/500M_subset
  train_split: train
  validation_split: validation
  train_batch_size: 128
  validation_batch_size: 256
  num_workers: 3
  shuffle_buffer_size: 10_000

model:
  vocab_size: 4
  context_length: 256
  # The encoder combines each non-overlapping nucleotide pair into one latent
  # position before multiscale quantization.
  latent_length: 128
  embed_dim: 128
  # A smaller vector gives each finite codebook fewer independently varying
  # values to approximate during nearest-code lookup.
  quantization_dim: 16
  num_heads: 4
  # RoPE is applied only in the decoder.
  rope_base: 10_000
  # Every scale is quantized after recursively applying learned stride-2
  # convolutions. Child vectors are detached at each boundary so a parent loss
  # cannot collapse its prediction targets. Scale 128 uses the exact ID
  # 4 * left_base + right_base and a trainable vector for each dinucleotide.
  scale_lengths: [1, 2, 4, 8, 16, 32, 64, 128]
  # All learned scales use 64 codes. At scale 64, four codes are reserved for
  # each possible left dinucleotide. At every coarser scale, one parent code is
  # reserved for each possible left-child code.
  codebook_sizes: [64, 64, 64, 64, 64, 64, 64, 16]
  group_codes_by_left_child: true

  decoder_num_layers: 4
  use_qk_norm: true
  bias: false

  decay: 0.99
  eps: 1e-5

  # Scales 1 through 64 predict their ordered pairs of immediate child codes.
  # Commitment is averaged over those seven EMA-quantized scales.
  hierarchy_prediction_weight: 1.0
  commitment_cost: 0.25

optimizer:
  learning_rate: 1e-4
  min_learning_rate: 3e-5
  warmup_steps: 300
  beta_1: 0.9
  beta_2: 0.99
  weight_decay: 0.01
  max_gradient_norm: 1.0
  gradient_accumulation_steps: 1

mixed_precision:
  enabled: true

training:
  num_epochs: 10
  # Set an integer here to override the epoch-derived training length.
  max_steps: null
  log_interval: 10

evaluation:
  interval: 1_000
  max_batches: 10

checkpoint:
  interval: 3_000

hydra:
  run:
    dir: ../runs/${wandb.name}
