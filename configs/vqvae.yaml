# Multiscale VQ-VAE tokenizer with triplet compression at the finest scale.

run:
  seed: 0
  resume_from: null

wandb:
  enabled: true
  entity: nsm-dna
  project: vqvae
  name: vqvae-384-triplet-k32-fine-only-core-refinement-delayed-kmeans

data:
  subset_directory: ../datasets/gtdb/500M_subset
  train_split: train
  validation_split: validation
  train_batch_size: 128
  validation_batch_size: 256
  num_workers: 3
  shuffle_buffer_size: 10_000

model:
  vocab_size: 4
  context_length: 384
  # The encoder combines each non-overlapping nucleotide triplet into one latent
  # position before quantization.
  latent_length: 128
  # Keep the third base as a smaller refinement of the first-two-base core.
  third_base_scale: 0.25
  embed_dim: 128
  # A smaller vector gives each finite codebook fewer independently varying
  # values to approximate during nearest-code lookup.
  quantization_dim: 16
  num_heads: 4
  # RoPE is applied only in the decoder.
  rope_base: 10_000
  # Coarse scales are built through learned stride-2 convolutions. The final
  # length-128 scale assigns each nucleotide triplet to one of 32 codes.
  scale_lengths: [1, 2, 4, 8, 16, 32, 64, 128]
  codebook_sizes: [32, 32, 64, 64, 128, 128, 128, 32]

  decoder_num_layers: 4
  use_qk_norm: true
  bias: false

  decay: 0.99
  eps: 1e-5

  # Each step also decodes one uniformly sampled non-final scale by itself.
  partial_reconstruction_weight: 0.25

optimizer:
  learning_rate: 1e-4
  min_learning_rate: 3e-5
  warmup_steps: 300
  beta_1: 0.9
  beta_2: 0.99
  weight_decay: 0.01
  max_gradient_norm: 1.0
  gradient_accumulation_steps: 1

mixed_precision:
  enabled: true

training:
  num_epochs: 10
  # Let the encoder establish its triplet geometry before fitting the codebook.
  reinitialize_codebook_step: 1_000
  # Set an integer here to override the epoch-derived training length.
  max_steps: null
  log_interval: 10

evaluation:
  interval: 1_000
  max_batches: 10

checkpoint:
  interval: 3_000

hydra:
  run:
    dir: ../runs/${wandb.name}
