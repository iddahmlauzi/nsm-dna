# Information-bottleneck VQ-VAE for 512-base NSM target blocks.

run:
  seed: 0
  resume_from: null

wandb:
  enabled: true
  entity: nsm-dna
  project: vqvae
  name: vqvae-512-latent128-vqdim32-k256-nocontext-decoder4-finalvq

data:
  subset_directory: ../datasets/gtdb/500M_subset
  train_split: train
  validation_split: validation
  train_batch_size: 16
  validation_batch_size: 256
  num_workers: 3
  shuffle_buffer_size: 10_000

model:
  vocab_size: 4
  context_length: 512
  # The learned encoder reduces 512 bases to this continuous latent length
  # before any multiscale quantization. The decoder learns the inverse expansion.
  latent_length: 128
  embed_dim: 384
  # Codebook matching occurs in this smaller space. The encoder projects 384 to
  # 32 before quantization, and the decoder projects 32 back to 384 afterward.
  quantization_dim: 32
  num_heads: 6
  rope_base: 10_000
  # 252 total code positions with 256 choices each give a nominal capacity of
  # 252 * log2(256) = 2,016 bits for each 1,024-bit input block.
  scale_lengths: [4, 8, 16, 32, 64, 128]
  codebook_sizes: [256, 256, 256, 256, 256, 256]

  encoder_dropout: 0.0
  decoder_dropout: 0.1
  decoder_num_layers: 4
  bias: false
  pre_quant_num_groups: 4

  commitment_cost: 0.25
  decay: 0.99
  eps: 1e-5

  refinement_ratio: 0.5
  refinement_kernel_size: 3

  # Always train the full reconstruction. One randomly selected non-final
  # cumulative scale receives an auxiliary reconstruction loss. Its gradient is
  # stronger on the quantizer path than on the shared decoder so it makes each
  # prefix useful without overwhelming the nearly solved full-decoder objective.
  partial_reconstruction_quantizer_weight: 0.2
  partial_reconstruction_decoder_weight: 0.01

optimizer:
  learning_rate: 1e-4
  encoder_learning_rate: 1e-4
  min_learning_rate: 3e-5
  warmup_steps: 300
  beta_1: 0.9
  beta_2: 0.99
  weight_decay: 0.01
  max_gradient_norm: 1.0
  gradient_accumulation_steps: 1

mixed_precision:
  enabled: true

training:
  num_epochs: 10
  # Set an integer here to override the epoch-derived training length.
  max_steps: null
  log_interval: 10

evaluation:
  interval: 1_000
  max_batches: 10

checkpoint:
  interval: 3_000

hydra:
  run:
    dir: ../runs/${wandb.name}
