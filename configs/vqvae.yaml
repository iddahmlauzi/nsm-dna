# Fixed-length information-bottleneck VQ-VAE.

run:
  seed: 0
  resume_from: null

wandb:
  enabled: true
  entity: nsm-dna
  project: vqvae
  name: vqvae-512

data:
  subset_directory: ../datasets/gtdb/500M_subset
  train_split: train
  validation_split: validation
  train_batch_size: 16
  validation_batch_size: 256
  num_workers: 3
  shuffle_buffer_size: 10_000

model:
  vocab_size: 4
  context_length: 512
  # The learned encoder reduces 512 bases to this continuous latent length
  # before any multiscale quantization. The decoder learns the inverse expansion.
  latent_length: 128
  embed_dim: 384
  # Codebook matching occurs in this smaller space. The encoder projects 384 to
  # 32 before quantization, and the decoder projects 32 back to 384 afterward.
  quantization_dim: 32
  num_heads: 6
  # RoPE is applied only in the decoder.
  rope_base: 10_000
  # 252 total code positions with 64 choices each give a nominal capacity of
  # 252 * log2(64) = 1,512 bits for each 1,024-bit input block.
  scale_lengths: [4, 8, 16, 32, 64, 128]
  codebook_sizes: [64, 64, 64, 64, 64, 64]

  dropout: 0.1
  encoder_num_layers: 0
  decoder_num_layers: 4
  use_qk_norm: true
  bias: false
  pre_quant_num_groups: 4

  commitment_cost: 0.25
  decay: 0.99
  eps: 1e-5

  # Corrupt only decoder-facing codes during training; keep the first scale clean.
  code_corruption: true

  refinement_ratio: 0.5
  refinement_kernel_size: 3
  # Every step trains both the complete hierarchy and one randomly truncated
  # hierarchy so the decoder can reconstruct from every stage of quantization.
  full_reconstruction_weight: 0.7
  truncated_reconstruction_weight: 0.3

optimizer:
  learning_rate: 1e-4
  min_learning_rate: 3e-5
  warmup_steps: 300
  beta_1: 0.9
  beta_2: 0.99
  weight_decay: 0.01
  max_gradient_norm: 1.0
  gradient_accumulation_steps: 1

mixed_precision:
  enabled: true

training:
  num_epochs: 10
  # Set an integer here to override the epoch-derived training length.
  max_steps: null
  log_interval: 10

evaluation:
  interval: 1_000
  max_batches: 10

checkpoint:
  interval: 3_000

hydra:
  run:
    dir: ../runs/${wandb.name}
