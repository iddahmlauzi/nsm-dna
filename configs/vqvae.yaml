# Multi-resolution information-bottleneck VQ-VAE.

run:
  seed: 0
  resume_from: null

wandb:
  enabled: true
  entity: nsm-dna
  project: vqvae
  name: vqvae-multires-128to1024-4x-vqdim32-k256-nocontext-decoder4-finalvq

data:
  subset_directory: ../datasets/gtdb/500M_subset
  train_split: train
  validation_split: validation
  # Every training batch contains 8,192 bases per GPU. A step selects one
  # sequence length, and all ranks use that same length for balanced DDP work.
  sequence_lengths: [128, 256, 512, 1024]
  train_batch_sizes: [64, 32, 16, 8]
  validation_batch_sizes: [128, 64, 32, 16]
  # One worker per resolution gives each rank four concurrent data workers.
  num_workers: 1
  shuffle_buffer_size: 10_000

model:
  vocab_size: 4
  context_length: 512
  max_context_length: 1024
  # The learned encoder reduces 512 bases to this continuous latent length
  # before any multiscale quantization. The decoder learns the inverse expansion.
  latent_length: 128
  embed_dim: 384
  # Codebook matching occurs in this smaller space. The encoder projects 384 to
  # 32 before quantization, and the decoder projects 32 back to 384 afterward.
  quantization_dim: 32
  num_heads: 6
  # RoPE is applied only in the decoder.
  rope_base: 10_000
  # This is the reference schedule at 512 bases. At runtime, the six position
  # counts scale in proportion to the input length while these six codebooks
  # and their 256-entry vocabularies remain shared.
  scale_lengths: [4, 8, 16, 32, 64, 128]
  codebook_sizes: [256, 256, 256, 256, 256, 256]

  dropout: 0.1
  encoder_num_layers: 0
  decoder_num_layers: 4
  use_qk_norm: true
  bias: false
  pre_quant_num_groups: 4

  commitment_cost: 0.25
  decay: 0.99
  eps: 1e-5

  # Corrupt only decoder-facing codes during training; keep the first scale clean.
  code_corruption: true

  refinement_ratio: 0.5
  refinement_kernel_size: 3
  # Every step trains both the complete hierarchy and one randomly truncated
  # hierarchy so the decoder can reconstruct from every stage of quantization.
  full_reconstruction_weight: 0.7
  truncated_reconstruction_weight: 0.3

optimizer:
  learning_rate: 1e-4
  min_learning_rate: 3e-5
  warmup_steps: 300
  beta_1: 0.9
  beta_2: 0.99
  weight_decay: 0.01
  max_gradient_norm: 1.0
  gradient_accumulation_steps: 1

mixed_precision:
  enabled: true

training:
  num_epochs: 10
  # Set an integer here to override the epoch-derived training length.
  max_steps: null
  log_interval: 10

evaluation:
  interval: 1_000
  max_batches: 10

checkpoint:
  interval: 3_000

hydra:
  run:
    dir: ../runs/${wandb.name}
