checkpoint: /workspace/checkpoints/transformer-plus-plus-256-40m/best.pt
dataset_directory: /workspace/datasets/lambda/LAMBDA/binary_segments_2k
output_directory: /workspace/results/lambda-probe-2k

# LAMBDA's smallest fixed-window classification task is 2 kb. Each segment is
# divided into the model's native 255-base contexts before mean pooling.
expected_sequence_length: 2_000
embedding_batch_size: 128
random_model_seed: 42
device: cuda:0

# These are the probe settings used by the official LAMBDA implementation.
probe:
  seed: 42
  hidden_dim: 256
  dropout: 0.3
  batch_size: 64
  max_epochs: 100
  learning_rate: 1e-3
  weight_decay: 1e-5
  scheduler_patience: 10
  early_stopping_patience: 20

hydra:
  run:
    dir: ${output_directory}
  output_subdir: null
  job:
    chdir: false
